<style>
  :root{
    --ink:#131519;--panel:#1B1E24;--panel-2:#22262E;--rule:#2E333C;--well:#0E1014;
    --paper:#E9E6DF;--dim:#8E9299;--dimmer:#63676E;
    --gold:#C9A227;--live:#D9A441;--clear:#5BA36F;--strain:#C25B4E;--fill:#3A4E5C;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--paper);font-family:Barlow,system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:660px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(72px + env(safe-area-inset-bottom))}
  .stamp{font-size:12px;color:var(--dimmer);margin:-6px 0 16px}
  .stamp b{color:var(--dim);font-weight:400}
  .num{font-family:"Barlow Condensed",Barlow,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
  h1{font-family:"Barlow Condensed",sans-serif;font-size:36px;font-weight:600;margin:0;letter-spacing:.02em;line-height:1}
  h2{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:500;margin:0 0 10px;letter-spacing:.02em}
  a{color:var(--gold);text-decoration:none}
  .meta{font-size:13px;color:var(--dim)}
  .hidden{display:none}

  /* home */
  .top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
  .slipcard{display:block;border:1px solid var(--rule);background:var(--panel);padding:16px 18px;margin-bottom:12px;color:var(--paper);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .slipcard:active{background:var(--panel-2)}
  .slipcard .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .slipcard .name{font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:600;line-height:1}
  .slipcard .pay{font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:600;color:var(--gold);line-height:1}
  .dots{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .dot{height:8px;flex:1;min-width:24px;max-width:70px;border-radius:1px}
  .slipcard .sub{margin-top:8px;font-size:13px;color:var(--dim)}
  .slipcard .sub b{font-weight:500;color:var(--paper)}
  .totals{border:1px solid var(--rule);border-top:none;background:var(--panel-2);padding:12px 18px;font-size:13px;color:var(--dim);display:flex;justify-content:space-between}
  .totals b{color:var(--paper);font-weight:500}

  /* detail */
  .back{font-size:14px;color:var(--gold);margin-bottom:14px;display:inline-block;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:4px 0}
  .slip{border:1px solid var(--rule);background:var(--panel);padding:16px 18px;margin-bottom:8px}
  .slip-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .stake{font-family:"Barlow Condensed",sans-serif;font-size:40px;font-weight:600;line-height:1;color:var(--gold)}
  .weekbar{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule);flex-wrap:wrap}
  .weekbar label{font-size:13px;color:var(--dim)}
  .headline{border:1px solid var(--rule);border-top:none;background:var(--panel-2);padding:14px 18px;margin-bottom:22px;font-size:14px}
  .headline b{font-weight:500}
  .resolved{font-size:13px;color:var(--dim);padding:10px 18px;border:1px solid var(--rule);border-top:none;background:var(--panel)}
  .resolved b{color:var(--clear);font-weight:500}

  .leg{border:1px solid var(--rule);background:var(--panel);margin-bottom:14px}
  .leg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 18px 0}
  .who{font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:500;line-height:1.1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .line-txt{font-size:13px;color:var(--dim);margin-top:2px}
  .badge{font-size:11px;letter-spacing:.06em;padding:4px 9px;border:1px solid;white-space:nowrap;flex-shrink:0}
  .b-clear{color:var(--clear);border-color:var(--clear)}
  .b-live{color:var(--live);border-color:var(--live)}
  .b-strain{color:var(--strain);border-color:var(--strain)}
  .inj{font-family:Barlow,sans-serif;font-size:11px;letter-spacing:.08em;padding:2px 6px;background:var(--strain);color:#fff;line-height:1.4}
  .inj.q{background:var(--live);color:#17181C}

  .hero{padding:14px 18px 4px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .hero-n{font-family:"Barlow Condensed",sans-serif;font-size:52px;font-weight:600;line-height:.9}
  .hero-l{font-size:13px;color:var(--dim);max-width:220px;line-height:1.4}
  .drift{font-size:13px;padding:0 18px 12px;color:var(--dim)}
  .track{margin:0 18px 4px;height:26px;background:var(--well);position:relative;border:1px solid var(--rule)}
  .fill{height:100%;background:var(--fill)}
  .fill.danger{background:#5C3A3A}
  .ghost{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--dim)}
  .track-labels{display:flex;justify-content:space-between;padding:0 18px 14px;font-size:12px;color:var(--dimmer)}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:0}
  .cell{background:var(--panel);padding:11px 18px}
  .cell dt{font-size:12px;color:var(--dim);margin:0}
  .cell dd{margin:2px 0 0;font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:500}

  .matchups{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule)}
  .mu{background:var(--panel);padding:11px 12px}
  .mu span{display:block;font-size:11px;color:var(--dimmer);letter-spacing:.05em}
  .mu strong{display:block;font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:500;margin-top:2px}
  .mu em{display:block;font-style:normal;font-size:12px;color:var(--dim)}

  .lastgame{padding:13px 18px;border-top:1px solid var(--rule);font-size:13.5px}
  .lastgame .lg-h{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;margin-bottom:4px}
  .lastgame .lg-h b{color:var(--paper);font-weight:500}
  .lastgame p{margin:0;color:var(--paper)}
  .lastgame p.empty{color:var(--dimmer)}

  .binary{padding:16px 18px 6px;display:flex;align-items:baseline;gap:14px}
  .binary .state{font-family:"Barlow Condensed",sans-serif;font-size:40px;font-weight:600;line-height:1}
  .binary .chances{font-size:13px;color:var(--dim)}

  .notes{padding:13px 18px;font-size:13.5px;color:var(--dim);border-top:1px solid var(--rule)}
  details summary{padding:11px 18px;font-size:13px;color:var(--gold);cursor:pointer;border-top:1px solid var(--rule);list-style:none}
  details summary::-webkit-details-marker{display:none}
  .log{padding:4px 18px 16px}
  .log-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #242830;font-size:14px;gap:10px}
  .log-row span:first-child{color:var(--dim)}
  .log-note{font-size:12.5px;color:var(--dimmer);padding:0 0 8px;border-bottom:1px solid #242830;margin-top:-4px}

  .entry{border:1px solid var(--rule);background:var(--panel);padding:16px 18px;margin-top:28px}
  .field{padding:10px 0;border-bottom:1px solid #242830}
  .field .fr{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .field label{font-size:14px;flex:1 1 120px}
  .field label em{display:block;font-style:normal;font-size:12px;color:var(--dim)}
  input,select,textarea{background:var(--well);border:1px solid var(--rule);color:var(--paper);font-family:"Barlow Condensed",sans-serif;font-size:18px;padding:7px 9px}
  input[type=number]{width:88px;text-align:right}
  input.opp{width:92px;font-size:15px}
  select{width:auto}
  select.injsel{font-size:14px;font-family:Barlow,sans-serif;padding:7px 6px}
  textarea{width:100%;margin-top:8px;font-family:Barlow,sans-serif;font-size:14px;min-height:56px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
  button{font-family:Barlow,sans-serif;font-size:15px;padding:11px 18px;margin-top:14px;background:var(--gold);color:#17181C;border:none;cursor:pointer}
  button.ghostbtn{background:none;color:var(--dim);border:1px solid var(--rule);margin-left:8px}
  .err{color:var(--strain);font-size:13px;margin-top:8px;display:none}
  .saved{color:var(--clear);font-size:13px;margin-top:8px;display:none}
  .foot{font-size:12.5px;color:var(--dimmer);margin-top:26px;line-height:1.6}
  @media (max-width:420px){.matchups{grid-template-columns:1fr}.hero-n{font-size:44px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"></div>

       notes:"Under. He needs to stay below 3,125. Rookie year was 2,272 in 14 games with 487 rushing yards and nine rushing TDs, so the offense ran through his legs. Harbaugh and Nagy are expected to run first. Nabers is back from the ACL, Mooney and Likely were added. Five concussion checks last year; any missed game helps this leg."}
    ]
  }
];

/* ---------- state ----------
   Two sources, merged:
     remote  = data.json committed to the repo (what the Monday job writes)
     local   = this device's edits and notes
   Local wins field by field, so an automated stat never wipes your note,
   and your correction is never overwritten by the next publish.        */
const KEY = "fantasy_tracker_v2";
let remote = { updated:null, throughWeek:0, legs:{} };
let local  = { legs:{} };
let store  = { legs:{} };

const disk = {
  async get(){
    try{ if(window.storage && window.storage.get){ const r = await window.storage.get(KEY); return r && r.value ? r.value : null; } }catch(e){}
    try{ return localStorage.getItem(KEY); }catch(e){ return null; }
  },
  async set(v){
    try{ if(window.storage && window.storage.set){ await window.storage.set(KEY, v); return true; } }catch(e){}
    try{ localStorage.setItem(KEY, v); return true; }catch(e){ return false; }
  }
};

function blankLeg(l){ return { weeks:{}, inj:"", injNote:"" }; }

function rebuild(){
  store = { legs:{} };
  for(const p of PARLAYS) for(const l of p.legs){
    const r = (remote.legs && remote.legs[l.id]) || {};
    const o = (local.legs && local.legs[l.id]) || {};
    const weeks = {};
    for(const w of Object.keys(r.weeks || {})) weeks[w] = Object.assign({}, r.weeks[w]);
    for(const w of Object.keys(o.weeks || {})) weeks[w] = Object.assign({}, weeks[w] || {}, o.weeks[w]);
    store.legs[l.id] = {
      weeks,
      inj:     o.inj     !== undefined ? o.inj     : (r.inj     !== undefined ? r.inj     : (l.inj || "")),
      injNote: o.injNote !== undefined ? o.injNote : (r.injNote !== undefined ? r.injNote : (l.injNote || ""))
    };
  }
}

async function load(){
  try{
    const res = await fetch("data.json", {cache:"no-store"});
    if(res.ok){ const j = await res.json(); if(j && typeof j === "object") remote = Object.assign(remote, j); }
  }catch(e){ /* running from the artifact frame or offline: seeds only */ }
  const raw = await disk.get();
  if(raw){ try{ const j = JSON.parse(raw); if(j && j.legs) local = j; }catch(e){} }
  if(!local.legs) local.legs = {};
  rebuild();
  route();
}

async function persist(){ rebuild(); await disk.set(JSON.stringify(local)); }

/* ---------- helpers ---------- */
function currentWeek(){
  const d = new Date();
  const w = 1 + Math.floor((d - SEASON_START) / (7*24*3600*1000));
  return Math.max(1, Math.min(18, w));
}
function S(id){ return store.legs[id]; }
function loggedWeeks(id){ return Object.keys(S(id).weeks).filter(w => typeof S(id).weeks[w].val === "number").map(Number).sort((a,b)=>a-b); }
function total(id){ return loggedWeeks(id).reduce((s,w)=> s + S(id).weeks[w].val, 0); }
function opp(leg, wk){ const t = S(leg.id).weeks[wk] && S(leg.id).weeks[wk].opp; return t || (SCHED[leg.team] && SCHED[leg.team][wk]) || ""; }
function isBye(leg, wk){ return opp(leg,wk) === "BYE"; }
function fmt(n, dec){ if(n===null || !isFinite(n)) return "\u2014"; return dec ? n.toFixed(dec) : Math.round(n).toLocaleString(); }
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------- engine ---------- */
function compute(leg){
  const st = S(leg.id);
  const played = loggedWeeks(leg.id).length;
  const cur = total(leg.id);
  const remaining = Math.max(0, GAMES - played);
  const target = leg.dir === "over" ? Math.floor(leg.line) + 1 : Math.floor(leg.line);

  if(leg.kind === "binary"){
    const hit = cur >= 1;
    const hitWeek = hit ? loggedWeeks(leg.id).find(w => S(leg.id).weeks[w].val >= 1) : null;
    const state = hit ? "clear" : remaining === 0 ? "strain" : remaining >= 8 ? "live" : "strain";
    return {kind:"binary", played, cur, remaining, target, hit, hitWeek, state, badge: hit ? "Cashed" : remaining === 0 ? "Missed" : "Not yet"};
  }

  const flat = target / GAMES;
  // 2026 form: this season's rate, regressed toward last season's over a 4-game prior
  // so one outlier week does not swing the read while the sample is tiny.
  const PRIOR = 4;
  const seasonRate = played > 0 ? cur / played : null;
  const formRate = played > 0 ? (cur + leg.ref.rate * PRIOR) / (played + PRIOR) : leg.ref.rate;
  let req = null, proj = null, cushion = 0, state = "live", badge = "Live";
  if(leg.dir === "over"){
    req = remaining > 0 ? (target - cur) / remaining : null;
    proj = played > 0 ? (cur / played) * GAMES : null;
    cushion = cur - flat * played;
    if(cur >= target){ state = "clear"; badge = "Cashed"; }
    else if(remaining === 0){ state = "strain"; badge = "Missed"; }
    else {
      const ratio = req / formRate;
      state = ratio < 0.85 ? "clear" : ratio > 1.10 ? "strain" : "live";
      badge = state === "clear" ? "Comfortable" : state === "strain" ? "Strained" : "Live";
    }
  } else {
    // under: target is the ceiling; req is what he can afford per game
    req = remaining > 0 ? (target - cur) / remaining : null;
    proj = played > 0 ? (cur / played) * GAMES : null;
    cushion = flat * played - cur; // positive = under budget
    if(cur > target){ state = "strain"; badge = "Missed"; }
    else if(remaining === 0){ state = "clear"; badge = "Cashed"; }
    else {
      const ratio = req / formRate;
      state = ratio > 1.15 ? "clear" : ratio < 0.90 ? "strain" : "live";
      badge = state === "clear" ? "Comfortable" : state === "strain" ? "Strained" : "Live";
    }
  }
  return {kind:"pace", played, cur, remaining, target, flat, req, proj, cushion, state, badge, formRate, seasonRate};
}

function pressure(leg){ // higher = tighter; used for headline + home dots
  const c = compute(leg);
  if(c.kind === "binary") return c.hit ? 0 : 1.0 + (17 - c.remaining) / 17;
  if(c.badge === "Cashed") return 0;
  if(c.badge === "Missed") return 9;
  const base = c.formRate || leg.ref.rate;
  return leg.dir === "over" ? c.req / base : base / c.req;
}
const stateColor = s => s === "clear" ? "var(--clear)" : s === "strain" ? "var(--strain)" : "var(--live)";

/* ---------- views ---------- */
function injTag(leg){
  const st = S(leg.id).inj;
  if(!st) return "";
  return '<span class="inj' + (st === "Q" ? " q" : "") + '" title="' + esc(S(leg.id).injNote) + '">' + st + '</span>';
}

function legHTML(p, leg, wkView){
  const c = compute(leg);
  const bcls = c.state === "clear" ? "b-clear" : c.state === "strain" ? "b-strain" : "b-live";
  const prevW = wkView - 1, nextW = wkView + 1;
  const prevRec = S(leg.id).weeks[prevW];
  const prevVal = prevRec && typeof prevRec.val === "number" ? fmt(prevRec.val, leg.dec==2?0:leg.dec) + " " + leg.unit : (isBye(leg,prevW) ? "bye" : "not logged");
  const lineTxt = leg.team + " " + leg.pos + " &middot; " + leg.dir + " " + leg.line + " " + leg.stat;

  let body = "";
  if(c.kind === "binary"){
    body =
      '<div class="binary"><div class="state" style="color:' + (c.hit ? "var(--clear)" : "var(--paper)") + '">' + (c.hit ? "Hit in week " + c.hitWeek : "Not yet") + '</div>' +
      '<div class="chances">' + (c.hit ? "resolved, nothing left to sweat" : c.remaining + " games left to get one") + '</div></div>' +
      '<div class="drift">Needs a single ' + (leg.unit === "TD" ? "score" : "completion") + ' all season. No pace to track, just whether the play gets called and lands.</div>';
  } else if(leg.dir === "over"){
    const pct = Math.min(100, (c.cur / c.target) * 100);
    const ghost = Math.min(100, (c.flat * c.played / c.target) * 100);
    const drift = c.played === 0
      ? "Season pace: " + fmt(c.flat, leg.dec) + " per game across all " + GAMES + "."
      : "Started at " + fmt(c.flat, leg.dec) + " per game. The bar has " + (c.req > c.flat ? "risen " + fmt(((c.req/c.flat)-1)*100,0) : "dropped " + fmt((1-(c.req/c.flat))*100,0)) + "% after " + c.played + (c.played===1?" game.":" games.");
    body =
      '<div class="hero"><div class="hero-n num">' + fmt(c.req, leg.dec) + '</div><div class="hero-l">' + leg.unit + ' per game needed over the ' + c.remaining + ' games left</div></div>' +
      '<div class="drift">' + drift + '</div>' +
      '<div class="track"><div class="fill" style="width:' + pct.toFixed(1) + '%"></div>' + (c.played ? '<div class="ghost" style="left:' + ghost.toFixed(1) + '%"></div>' : '') + '</div>' +
      '<div class="track-labels"><span>' + fmt(c.cur, 0) + ' banked</span><span>' + c.target + ' needed</span></div>' +
      '<dl class="grid">' +
        '<div class="cell"><dt>Cushion vs flat pace</dt><dd class="num">' + (c.played ? (c.cushion>=0?"+":"") + fmt(c.cushion, leg.dec==2?1:0) : "\u2014") + '</dd></div>' +
        '<div class="cell"><dt>Projected finish</dt><dd class="num">' + (c.proj===null ? "\u2014" : fmt(c.proj, leg.dec==2?1:0)) + '</dd></div>' +
        (c.played
          ? '<div class="cell"><dt>2026 form</dt><dd class="num">' + fmt(c.formRate, leg.dec) + '</dd></div>' +
            '<div class="cell"><dt>2026 raw rate</dt><dd class="num">' + fmt(c.seasonRate, leg.dec) + '</dd></div>'
          : '<div class="cell"><dt>' + leg.ref.label + '</dt><dd class="num">' + fmt(leg.ref.rate, leg.dec) + '</dd></div>' +
            (leg.alt ? '<div class="cell"><dt>' + leg.alt.label + '</dt><dd class="num">' + fmt(leg.alt.rate, leg.dec) + '</dd></div>' : '<div class="cell"><dt>Games left</dt><dd class="num">' + c.remaining + '</dd></div>')) +
      '</dl>';
  } else {
    const pct = Math.min(100, (c.cur / c.target) * 100);
    const ghost = Math.min(100, (c.flat * c.played / c.target) * 100);
    const drift = c.played === 0
      ? "Budget: " + fmt(c.flat, leg.dec) + " per game keeps him under across all " + GAMES + "."
      : "Started with a budget of " + fmt(c.flat, leg.dec) + " per game. It has " + (c.req > c.flat ? "loosened to" : "tightened to") + " " + fmt(c.req, leg.dec) + " after " + c.played + (c.played===1?" game.":" games.");
    body =
      '<div class="hero"><div class="hero-n num">' + fmt(c.req, leg.dec) + '</div><div class="hero-l">' + leg.unit + ' per game he can average over the ' + c.remaining + ' games left and still stay under</div></div>' +
      '<div class="drift">' + drift + '</div>' +
      '<div class="track"><div class="fill danger" style="width:' + pct.toFixed(1) + '%"></div>' + (c.played ? '<div class="ghost" style="left:' + ghost.toFixed(1) + '%"></div>' : '') + '</div>' +
      '<div class="track-labels"><span>' + fmt(c.cur, 0) + ' used</span><span>' + c.target + ' is the ceiling</span></div>' +
      '<dl class="grid">' +
        '<div class="cell"><dt>Room vs flat budget</dt><dd class="num">' + (c.played ? (c.cushion>=0?"+":"") + fmt(c.cushion, 0) : "\u2014") + '</dd></div>' +
        '<div class="cell"><dt>Projected finish</dt><dd class="num">' + (c.proj===null ? "\u2014" : fmt(c.proj, 0)) + '</dd></div>' +
        (c.played
          ? '<div class="cell"><dt>2026 form</dt><dd class="num">' + fmt(c.formRate, leg.dec) + '</dd></div>' +
            '<div class="cell"><dt>2026 raw rate</dt><dd class="num">' + fmt(c.seasonRate, leg.dec) + '</dd></div>'
          : '<div class="cell"><dt>' + leg.ref.label + '</dt><dd class="num">' + fmt(leg.ref.rate, leg.dec) + '</dd></div>' +
            (leg.alt ? '<div class="cell"><dt>' + leg.alt.label + '</dt><dd class="num">' + fmt(leg.alt.rate, leg.dec) + '</dd></div>' : '')) +
      '</dl>';
  }

  const lastNote = prevRec && prevRec.note ? '<p>' + esc(prevRec.note) + '</p>' : '<p class="empty">No breakdown logged yet for this game.</p>';
  const rows = loggedWeeks(leg.id).map(w => {
    const r = S(leg.id).weeks[w];
    return '<div class="log-row"><span>Week ' + w + (opp(leg,w) ? " &middot; " + esc(opp(leg,w)) : "") + (r.inj ? ' &middot; <span class="inj' + (r.inj==="Q"?" q":"") + '">' + r.inj + '</span>' : '') + '</span><span class="num">' + fmt(r.val, leg.dec==2?0:leg.dec) + ' ' + leg.unit + '</span></div>' +
      (r.note ? '<div class="log-note">' + esc(r.note) + '</div>' : '');
  }).join("");

  return '<div class="leg" style="border-left:3px solid ' + leg.color + '">' +
    '<div class="leg-head"><div><div class="who" style="color:' + leg.color + '">' + leg.who + injTag(leg) + '</div><div class="line-txt">' + lineTxt + '</div></div>' +
      '<div class="badge ' + bcls + '">' + c.badge + '</div></div>' +
    body +
    '<div class="matchups">' +
      '<div class="mu"><span>Last</span><strong>' + (esc(opp(leg,prevW)) || "\u2014") + '</strong><em>' + prevVal + '</em></div>' +
      '<div class="mu"><span>This week</span><strong>' + (esc(opp(leg,wkView)) || "\u2014") + '</strong><em>week ' + wkView + '</em></div>' +
      '<div class="mu"><span>Next</span><strong>' + (esc(opp(leg,nextW)) || "\u2014") + '</strong><em>week ' + nextW + '</em></div>' +
    '</div>' +
    '<div class="lastgame"><div class="lg-h"><span>Last game</span><b>' + (prevRec && typeof prevRec.val==="number" ? "Week " + prevW + " " + esc(opp(leg,prevW)) : "\u2014") + '</b></div>' + lastNote + '</div>' +
    (S(leg.id).injNote ? '<div class="notes" style="color:var(--paper)">' + esc(S(leg.id).injNote) + '</div>' : '') +
    '<div class="notes">' + leg.notes + '</div>' +
    (rows ? '<details><summary>Game log</summary><div class="log">' + rows + '</div></details>' : '') +
  '</div>';
}

function renderHome(){
  const wk = currentWeek();
  let html = '<div class="top"><h1>Fantasy Tracker</h1><span class="meta">week ' + wk + ' of 18</span></div>';
  html += '<div class="stamp">' + (remote.updated
    ? 'Stats published through week <b>' + remote.throughWeek + '</b> &middot; last refresh <b>' + esc(remote.updated) + '</b>'
    : 'No published stats yet &middot; logging by hand') + '</div>';
  let stake = 0, pay = 0, open = 0, dead = 0;
  for(const p of PARLAYS){
    const cs = p.legs.map(l => ({leg:l, c:compute(l)}));
    const alive = cs.filter(x => x.c.badge !== "Cashed" && x.c.badge !== "Missed").length;
    const missed = cs.filter(x => x.c.badge === "Missed").length;
    const tight = cs.slice().sort((a,b)=> pressure(b.leg) - pressure(a.leg))[0];
    stake += parseFloat(p.stake.replace("$","")); pay += parseFloat(p.payout.replace("$",""));
    if(missed) dead++; else open++;
    html += '<div class="slipcard" data-slip="' + p.id + '" role="button" tabindex="0">' +
      '<div class="row"><div class="name">' + p.name + '</div><div class="pay num">' + p.payout + '</div></div>' +
      '<div class="meta">' + p.stake + ' &middot; ' + p.picks + ' &middot; ' + p.mult + '</div>' +
      '<div class="dots">' + cs.map(x => '<div class="dot" style="background:' + (x.c.badge === "Missed" ? "var(--strain)" : stateColor(x.c.state)) + '" title="' + x.leg.who + '"></div>').join("") + '</div>' +
      '<div class="sub">' + (missed ? '<b style="color:var(--strain)">Busted</b> &middot; ' : '') + alive + ' of ' + p.legs.length + ' legs open &middot; tightest: <b style="color:' + tight.leg.color + '">' + tight.leg.who + '</b></div>' +
    '</div>';
  }
  html += '<div class="totals"><span><b>$' + stake.toFixed(2) + '</b> staked</span><span><b>$' + pay.toFixed(2) + '</b> if all three land</span><span><b>' + open + '</b> of 3 alive</span></div>';
  html += '<p class="foot">Green is comfortable, amber is live, red is strained or busted. Tap a slip for pace, matchups, injury tags and the game log. Everything you save here stays saved.</p>';
  document.getElementById("app").innerHTML = html;
  Array.prototype.forEach.call(document.querySelectorAll("[data-slip]"), el => {
    const go = () => openSlip(el.getAttribute("data-slip"));
    el.addEventListener("click", go);
    el.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); go(); } });
  });
}

function renderParlay(p){
  const nowWk = currentWeek();
  const wkView = p._view || nowWk;
  const cs = p.legs.map(l => ({leg:l, c:compute(l)}));
  const alive = cs.filter(x => x.c.badge !== "Cashed" && x.c.badge !== "Missed").length;
  const missed = cs.filter(x => x.c.badge === "Missed").length;
  const tight = cs.slice().sort((a,b)=> pressure(b.leg) - pressure(a.leg))[0];
  const played = Math.max(...p.legs.map(l => loggedWeeks(l.id).length), 0);

  let html = '<span class="back" id="back" role="button" tabindex="0">&larr; All slips</span>';
  html += '<div class="slip"><div class="slip-top"><div><h1>' + p.name + '</h1><div class="meta">' + p.picks + ' &middot; ' + p.mult + '</div></div>' +
    '<div style="text-align:right"><div class="stake num">' + p.payout + '</div><div class="meta">from ' + p.stake + '</div></div></div>' +
    '<div class="weekbar"><label for="wk">Viewing week</label><select id="wk">' + Array.from({length:18},(_,i)=>'<option value="'+(i+1)+'"'+((i+1)===wkView?' selected':'')+'>Week '+(i+1)+'</option>').join("") + '</select>' +
    '<span class="meta">' + (played === 0 ? "no games logged yet" : played + " weeks logged") + '</span></div></div>';

  let tightTxt;
  if(tight.c.kind === "binary") tightTxt = "still waiting on a single play";
  else if(tight.leg.dir === "under") tightTxt = "can afford only " + fmt(tight.c.req, tight.leg.dec) + " " + tight.leg.unit + " a game";
  else tightTxt = "needing " + fmt(tight.c.req, tight.leg.dec) + " " + tight.leg.unit + " a game against " +
    (tight.c.played ? "2026 form of " + fmt(tight.c.formRate, tight.leg.dec) : "a " + tight.leg.ref.blurb + " baseline");
  html += p.resolved.map(r => '<div class="resolved"><b>' + r.who + '</b> ' + r.text + '</div>').join("");
  html += '<div class="headline">' + (missed ? '<b style="color:var(--strain)">Slip is busted.</b> ' : (played === 0 ? "Nothing logged yet, every leg is priced off 2025 form. " : alive + " of " + p.legs.length + " legs still open. ")) +
    "Tightest right now: <b style=\"color:" + tight.leg.color + "\">" + tight.leg.who + "</b>, " + tightTxt + ".</div>";

  html += p.legs.map(l => legHTML(p, l, wkView)).join("");

  // entry
  const ewk = p._ewk || Math.min(18, Math.max(1, played + 1));
  html += '<div class="entry"><h2>Log a week</h2>' +
    '<div class="field"><div class="fr"><label for="ewk">Week</label><select id="ewk">' + Array.from({length:18},(_,i)=>'<option value="'+(i+1)+'"'+((i+1)===ewk?' selected':'')+'>Week '+(i+1)+'</option>').join("") + '</select></div></div>' +
    '<div id="entryfields"></div>' +
    '<button id="save">Save week</button><button class="ghostbtn" id="clear">Clear this slip</button>' +
    '<div class="err" id="err"></div><div class="saved" id="ok">Saved</div></div>';
  html += '<p class="foot">Log 0 with an O or IR tag when he sits; the season total does not grow but the games-remaining count still drops, which is what actually happens to the bet. Over legs show the per-game rate still needed. The under leg shows the per-game rate he can afford. Binary legs just wait for one play. The pale marker is where a flat pace would sit. The status tag next to a name is his current designation; the one in the game log is what he was that week. Use the note box for how he played and why.</p>';

  document.getElementById("app").innerHTML = html;
  const back = document.getElementById("back");
  const home = () => { p._view = null; p._ewk = null; renderHome(); window.scrollTo({top:0}); };
  back.addEventListener("click", home);
  back.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); home(); } });
  document.getElementById("wk").addEventListener("change", e => { p._view = Number(e.target.value); renderParlay(p); });
  document.getElementById("ewk").addEventListener("change", e => { p._ewk = Number(e.target.value); drawEntry(p); });
  document.getElementById("save").addEventListener("click", () => saveWeek(p));
  document.getElementById("clear").addEventListener("click", async () => {
    for(const l of p.legs){ delete local.legs[l.id]; }
    await persist(); p._view = null; renderParlay(p);
  });
  drawEntry(p);
}

function drawEntry(p){
  const w = Number(document.getElementById("ewk").value);
  document.getElementById("entryfields").innerHTML = p.legs.map(l => {
    const rec = S(l.id).weeks[w] || {};
    const bye = isBye(l, w);
    const cur = S(l.id).inj || "";
    return '<div class="field"><div class="fr">' +
      '<label for="in_' + l.id + '" style="color:' + l.color + '">' + l.who + '<em style="color:var(--dim)">' + l.stat + (bye ? " &middot; bye week" : "") + '</em></label>' +
      '<input class="opp" type="text" id="op_' + l.id + '" placeholder="opp" value="' + esc(rec.opp || (SCHED[l.team] && SCHED[l.team][w]) || "") + '">' +
      '<select class="injsel" id="ij_' + l.id + '" title="status">' +
        ["","Q","D","O","IR","PUP"].map(s => '<option value="' + s + '"' + ((rec.inj !== undefined ? rec.inj : cur) === s ? ' selected' : '') + '>' + (s || "OK") + '</option>').join("") + '</select>' +
      '<input type="number" step="any" min="0" id="in_' + l.id + '" value="' + (typeof rec.val === "number" ? rec.val : "") + '" placeholder="' + (bye ? "bye" : "0") + '"' + (bye ? ' disabled' : '') + '>' +
      '</div>' +
      '<textarea id="nt_' + l.id + '" placeholder="How he played and why: targets, coverage attacked, what the defense gave up">' + esc(rec.note || "") + '</textarea>' +
      '</div>';
  }).join("");
}

async function saveWeek(p){
  const w = Number(document.getElementById("ewk").value);
  const err = document.getElementById("err"), ok = document.getElementById("ok");
  err.style.display = "none"; ok.style.display = "none";
  let any = false;
  const pending = [];
  for(const l of p.legs){
    const raw = document.getElementById("in_" + l.id).value.trim();
    const oppv = document.getElementById("op_" + l.id).value.trim();
    const inj = document.getElementById("ij_" + l.id).value;
    const note = document.getElementById("nt_" + l.id).value.trim();
    const rec = Object.assign({}, S(l.id).weeks[w] || {});
    if(oppv) rec.opp = oppv;
    rec.inj = inj;
    if(note) rec.note = note; else delete rec.note;
    if(raw !== ""){
      const v = Number(raw);
      if(!isFinite(v) || v < 0){ err.textContent = "Enter 0 or more for " + l.who + "."; err.style.display = "block"; return; }
      rec.val = v; any = true;
    }
    pending.push([l, rec, inj]);
  }
  if(!any){ err.textContent = "Enter at least one stat line. Use 0 for a game he played without production or sat out."; err.style.display = "block"; return; }
  for(const [l, rec, inj] of pending){
    if(!local.legs[l.id]) local.legs[l.id] = { weeks:{} };
    if(!local.legs[l.id].weeks) local.legs[l.id].weeks = {};
    local.legs[l.id].weeks[w] = rec;
    local.legs[l.id].inj = inj;
    if(!inj) local.legs[l.id].injNote = "";
  }
  await persist();
  ok.style.display = "block";
  p._view = null;
  renderParlay(p);
  window.scrollTo({top:0});
}

/* ---------- routing (in-page only, no hash) ---------- */
function openSlip(id){
  const p = PARLAYS.find(x => x.id === id);
  if(p){ renderParlay(p); window.scrollTo({top:0}); }
}
function route(){ renderHome(); }
load();
</script>
